name: Build Windows plugin
on:
  push:
    branches: [feature/initial-juce-scaffold, main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build plugin and standalone
        run: cmake --build build --config Release --parallel 2
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: cyber-distortion-windows
          path: |
            build/CyberDistortion_artefacts/Release/Standalone/**
            build/CyberDistortion_artefacts/Release/VST3/**
          if-no-files-found: error
